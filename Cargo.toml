[workspace]
resolver = "2"
members = [
    "rust/crates/polkavm-gpu-wire",
    "rust/crates/polkavm-motion-wire",
    "rust/crates/polkavm-ui-wire",
    "rust/crates/polkavm-host-runtime",
    "rust/crates/polkavm-host-runtime-assets",
    "rust/crates/polkavm-assets-export",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/paritytech/polkavm-host-runtime"

[workspace.dependencies]
uniffi = "0.32.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
