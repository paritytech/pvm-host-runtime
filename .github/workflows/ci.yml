name: Runtime CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      browser: ${{ steps.paths.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        name: Select required lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="$PUSH_BASE"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          elif [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-parse "$HEAD_SHA^")"
          fi
          rust=false
          browser=false
          while IFS= read -r file; do
            case "$file" in
              Cargo.toml|Cargo.lock|rust-toolchain.toml|rust/*|conformance/*|.github/*)
                rust=true
                ;;
            esac
            case "$file" in
              Cargo.toml|Cargo.lock|rust-toolchain.toml|package.json|package-lock.json|rust/crates/polkavm-host-runtime/*|rust/crates/polkavm-gpu-wire/*|rust/crates/polkavm-motion-wire/*|rust/crates/polkavm-host-runtime-assets/*|conformance/*|js/*|scripts/*|.github/*)
                browser=true
                ;;
            esac
          done < <(git diff --name-only "$base" "$HEAD_SHA")
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "browser=$browser" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust runtime
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust targets and components
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Install conformance guest toolchain
        run: |
          rustup toolchain install nightly-2025-10-09 --profile minimal --component rust-src
          cargo install polkatool --version 0.31.0 --locked
      - name: Format
        run: cargo +nightly fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check conformance guests
        run: scripts/check-conformance-guests.sh
      # Ubuntu's AppArmor policy otherwise blocks PolkaVM's Linux sandbox.
      - name: Enable sandbox user namespaces on the ephemeral runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test
        run: cargo test --workspace --all-features
      - name: Check browser target
        run: cargo check --locked --release --target wasm32-unknown-unknown -p polkavm-host-runtime

  browser:
    name: Browser runtime and assets
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust browser target
        run: rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build, test, and reproduce assets
        run: npm test
      - name: Upload reproduced browser assets
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-browser-assets
          path: js/packages/polkavm-browser-runtime/dist
      - name: Check browser package contents
        run: npm pack --workspace @parity/polkavm-browser-runtime --dry-run --json
      - name: Check asset exporter
        run: |
          cargo run --locked -p polkavm-assets-export -- --output "$RUNNER_TEMP/polkavm-assets"
          diff -r rust/crates/polkavm-host-runtime-assets/assets "$RUNNER_TEMP/polkavm-assets"

  merge-readiness:
    name: Merge readiness
    if: always()
    needs: [changes, rust, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected lane
        env:
          RUST_SELECTED: ${{ needs.changes.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
          BROWSER_SELECTED: ${{ needs.changes.outputs.browser }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUST_SELECTED" == "true" && "$RUST_RESULT" != "success" ]]; then
            echo "Rust runtime lane: $RUST_RESULT" >&2
            exit 1
          fi
          if [[ "$BROWSER_SELECTED" == "true" && "$BROWSER_RESULT" != "success" ]]; then
            echo "Browser runtime lane: $BROWSER_RESULT" >&2
            exit 1
          fi
          echo "Selected runtime lanes passed"
